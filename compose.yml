# Local: build the production image and serve it on http://localhost:8080.
#   docker compose up --build
# For day-to-day work use `npm run dev`; this is for checking the real image.

services:
  web:
    build: .
    ports:
      - '8080:8080'
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
