# Host nginx vhost: mumtaaz.xyz (and www, redirected to the apex).
#
# Install: copy to /etc/nginx/sites-available/portfolio, symlink into
# sites-enabled, `sudo nginx -t && sudo systemctl reload nginx`.
#
# TLS follows the other vhosts on this host: Cloudflare origin certificate,
# DNS proxied through Cloudflare. The certificate must cover the apex as well
# as *.mumtaaz.xyz (Cloudflare's default origin certificate does).

server {
    listen 80;
    server_name mumtaaz.xyz www.mumtaaz.xyz;
    return 301 https://mumtaaz.xyz$request_uri;
}

server {
    listen 443 ssl;
    server_name www.mumtaaz.xyz;

    ssl_certificate     /etc/cloudflare/live/mumtaaz.xyz.pem;
    ssl_certificate_key /etc/cloudflare/live/mumtaaz.xyz.key;

    return 301 https://mumtaaz.xyz$request_uri;
}

server {
    listen 443 ssl;
    server_name mumtaaz.xyz;

    ssl_certificate     /etc/cloudflare/live/mumtaaz.xyz.pem;
    ssl_certificate_key /etc/cloudflare/live/mumtaaz.xyz.key;

    # Static site: no uploads through here (the CMS commits to GitHub).
    client_max_body_size 1m;

    location / {
        # Must match HOST_PORT in ~/apps/portfolio/.env.
        proxy_pass http://127.0.0.1:32791;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
