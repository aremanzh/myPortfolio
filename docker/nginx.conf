# Serves build/client inside the container. TLS, the domain and the real
# client IP are the host nginx's job (deploy/nginx-portfolio.conf); this
# server only sees plain HTTP from 127.0.0.1.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    charset utf-8;

    # Behind a proxy: a redirect must keep the visitor's scheme and host, not
    # become http://<container>:8080/...
    absolute_redirect off;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml
               image/svg+xml text/plain application/manifest+json text/yaml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The CMS loads config.yml relative to its own URL, so /admin (no slash)
    # would look for /config.yml and break.
    location = /admin {
        return 301 /admin/;
    }

    # The old site linked to /contacts. A real redirect, not a client-side one.
    location = /contacts {
        return 301 /contact;
    }

    # Content-hashed by Vite: a changed file gets a new name.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Resized images, content-hashed by scripts/content.mjs.
    location /uploads/_r/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Original uploads keep their names when replaced, so a day only.
    location /uploads/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location /admin/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        # config.yml has no entry in mime.types.
        default_type text/yaml;
        try_files $uri $uri/index.html =404;
    }

    # Pages. Every real page was prerendered to <path>/index.html, so anything
    # else is a 404: it gets a real 404 status, and the SPA fallback page as
    # the body, which boots the app and shows the 404 page.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
        error_page 404 /__spa-fallback.html;
    }

    location = /__spa-fallback.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
}
