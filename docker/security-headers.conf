# Included in every location that sets its own headers: nginx drops
# server-level add_header directives as soon as a location adds one.
#
# HSTS is not here. TLS ends at Cloudflare and the host nginx, which own it.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
